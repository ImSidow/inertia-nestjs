name: CI

on:
    push:
        branches:
            - main
            - feat/**
            - fix/**
            - test/**
            - chore/**
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        name: Node ${{ matrix.node-version }} / NestJS ${{ matrix.nestjs }}

        strategy:
            fail-fast: false
            matrix:
                # Node 20 resolves to the latest 20.x (20.19+), which NestJS 12
                # and Vitest 4 need for require() of ES modules.
                node-version: [20, 22, 24]
                # Every NestJS major in the peerDependencies range.
                nestjs: [10, 11, 12]
                # @fastify/view major per NestJS, within @nestjs/platform-fastify's peer
                # range: Nest 10 (Fastify 4) accepts ^7 || ^8; Nest 11+ (Fastify 5) ^12.
                include:
                    - nestjs: 10
                      fastify-view: 8
                    - nestjs: 11
                      fastify-view: 12
                    - nestjs: 12
                      fastify-view: 12

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            # Pin the matrix versions first, then install once: an extra
            # `npm install --no-save` on top of an install trips an npm bug
            # ("Cannot read properties of null (reading 'edgesOut')").
            - name: Pin NestJS ${{ matrix.nestjs }}
              run: >-
                  npm pkg set
                  devDependencies.@nestjs/common=^${{ matrix.nestjs }}
                  devDependencies.@nestjs/core=^${{ matrix.nestjs }}
                  devDependencies.@nestjs/platform-express=^${{ matrix.nestjs }}
                  devDependencies.@nestjs/platform-fastify=^${{ matrix.nestjs }}
                  devDependencies.@nestjs/testing=^${{ matrix.nestjs }}
                  devDependencies.@fastify/view=^${{ matrix.fastify-view }}

            - name: Install dependencies
              run: npm install

            - name: Type-check (src and tests)
              run: npx tsc --noEmit -p tsconfig.json

            - name: Build package
              run: npm run build

            - name: Run tests
              run: npm run test:ci
